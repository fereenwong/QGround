[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qground"
version = "0.1.0"
description = "Condition-wise evidence aggregation for 3D grounding with 2D VLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.1.2", "torchvision>=0.16.2",
  "transformers==4.46.0", "tokenizers>=0.20,<0.21", "accelerate>=0.29.1",
  "numpy>=1.26", "Pillow", "PyYAML", "tqdm", "pandas",
  "einops", "sentencepiece", "protobuf", "requests", "safetensors"
]

[project.optional-dependencies]
preprocess = ["open3d", "plyfile", "scipy", "trimesh", "opencv-python", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["llava*"]
namespaces = true

[tool.setuptools.package-data]
"llava.dataset" = ["*.yaml"]
